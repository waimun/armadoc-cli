name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check the tag matches both package versions
        run: |
          for pkg in packages/crypto packages/cli; do
            version=$(node -p "require('./$pkg/package.json').version")
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "$pkg is $version, tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

      - name: Stage both packages for approval
        run: |
          for pkg in packages/crypto packages/cli; do
            (cd "$pkg" && npm stage publish --provenance --access public)
          done
